[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychds-schema"
version = "1.5.0"
description = "Psych-DS schema specification and validation tools"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Psych-DS Contributors"}
]
keywords = ["psychology", "data", "schema", "validation", "psychds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PyYAML>=6.0",
    "hjson>=3.1.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "Markdown>=3.4.0",
    "Pygments>=2.15.0",
    "natsort>=8.0.0",
    "ghp-import>=2.1.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://psych-ds.github.io/"
Documentation = "https://psych-ds.github.io/psychDS-docs/"
Repository = "https://github.com/psych-ds/psych-DS"
Issues = "https://github.com/psych-ds/psych-DS/issues"

[project.scripts]
psychds-convert = "schema_model.tools.convert_to_json:main"
psychds-yaml2md = "schema_model.tools.yaml_to_md:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schema_model*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
